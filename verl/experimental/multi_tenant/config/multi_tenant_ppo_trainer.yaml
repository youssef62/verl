hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

trainer:
  use_legacy_worker_impl: disable

async_training:

  # Maximum samples staleness threshold
  staleness_threshold: 0.1

  # Frequency of parameter synchronization between rollouter and trainer,
  # One step means trainer obtains a batch of required samples
  trigger_parameter_sync_step: 4

  # The number of ppo_mini_batches that the decoupled trainer obtains once
  require_batches: 1

  # When synchronizing parameters, Whether to resume generation when rollout is interrupted.
  # If True, AsyncLLMServerManager auto resume generation, making rollout interruption invisible to the AgentLoop.
  partial_rollout: True

  # whether to use trainer do_validate
  use_trainer_do_validate: False

  # Max in-flight generations per vLLM server handle. Controls backpressure.
  # In multi-tenant mode the effective limit is this value * num_tenants.
  max_concurrent_samples_per_replica: 16

# Multi-tenant config. Each tenant is a LoRA adapter over the shared base model.
# Provide tenants either inline (the `tenants` list), via a YAML file (`config_path`),
# or override on the command line (e.g. `+multi_tenant.tenants='alice:train.parquet:val.parquet:1e-5,...'`).
multi_tenant:

  # Inline list of tenant configs. Each entry:
  #   - name: <tenant name>
  #     train_file: <path to train parquet>
  #     val_file: <path to val parquet>
  #     learning_rate: <optional per-tenant LR override>
  #     max_response_length: <optional per-tenant generation length>
  tenants: null

  # Path to a YAML file containing a top-level `tenants:` list (alternative to inline `tenants`).
  config_path: null

  # Scheduling policy for the multi-tenant rollouter:
  #   round_robin (interleave tenants) or burst (fill one tenant at a time).
  scheduling: round_robin

# Rollout config
rollout:

  # Number of nodes used in the rollout
  nnodes: 1

  # Number of GPUs per node
  n_gpus_per_node: 8

  # number of responses (i.e. num sample times). > 1 for grpo
  n: 4

  # total rollout samples # TODO rename to total_rollout_samples
  total_rollout_steps: 100

data:
  # Number of samples generated, currently only support 1
  gen_batch_size: 1

actor_rollout_ref:

  rollout:
    # Must be enabled! Otherwise, log_probs cannot be calculated.
    calculate_log_probs: True

    checkpoint_engine:
      backend: "nccl"

  actor:
    # Must use rollout log probs for training
    use_rollout_log_probs: True

# Only then will the use of log probs be correct.
# And it can be used in conjunction with other rollout_correction algorithms.
algorithm:
  rollout_correction:
    bypass_mode: True
